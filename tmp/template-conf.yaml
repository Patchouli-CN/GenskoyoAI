# 记忆配置
memory:
  working_max_turns: 20
  semantic_enabled: false  # 当前用 Claude 不带 embedding，临时关闭语义记忆；后续接 embedding 后改回 true
  semantic_top_k: 5
  semantic_similarity_threshold: 0.7
  semantic_max_topics: 50        # 话题数上限：达到后新增话题时淘汰回忆权重最低的非 pin 话题
  auto_memory_enabled: true
  auto_memory_model: null        # 自动记忆模型；null = 跟随主模型（当前无消费方，预留）
  distill_enabled: true          # 定期记忆蒸馏：每 distill_turns 轮对话后自动提炼珍贵记忆写入语义记忆
  distill_turns: 10
  topic_decay_enabled: true      # 话题热度淘汰：冷话题对主动机制隐藏（不删除，被重新谈起时复活）
  topic_half_life_hours: 72      # 话题热度半衰期（小时）：默认 3 天，约 10 天无人提起即隐藏
  topic_decay_threshold: 0.1     # 热度低于此值即隐藏
  topic_pin_importance: 8.0      # 重要性达到此值的话题免疫衰减（反复强化的核心记忆）
  
  # 话题生成配置
  topic_generation:
    name_max_length: 10
    summary_max_length: 100

think_engine:
  enabled: true
  think_interval_minutes: 1
  random_walk_steps_min: 2
  random_walk_steps_max: 5
  emotional_trigger_threshold: 0.5
  emotional_priority_probability: 0.7
  think_cooldown_minutes: 10        # 话题被思考后多少分钟内降低再次选中概率
  walk_visit_dedup: true            # 单次随机游走是否避免重复访问同一话题
  think_temperature: 0.7
  think_max_tokens: 200
  initiative_temperature: 0.8
  initiative_max_tokens: 100

# 主动定时器：AI 回复完成后可生成一条积存主动消息和可编辑触发时间
initiative_timer:
  enabled: true
  min_delay_seconds: 30
  max_delay_seconds: 1800
  decision_temperature: 0.4
  decision_max_tokens: 300
  max_initiative_times: 1           # 用户回复后最多连续主动发言次数；达到上限后暂停主动定时器
  max_pending_summary_chars: 240
  allow_frontend_edit_summary: true
  replace_user_modified_timer: true
  expose_pending_summary: true
  # 对话欲（§7.3）：ThinkEngine 四维心情模型打分（一次短 JSON LLM），
  # total_drive 超阈值即主动发言，否则沉默——无累积器、无犹豫链、无强制兜底。
  # 旧的 fallback_* 强制兜底链、hesitation_* 犹豫链与 drive_* 累积键已删除（旧键仅警告迁移）。
  drive_threshold: 0.6              # total_drive（0~1 加权）超过该值即主动发言

# 复读烦躁模型（§8.11）：同一用户连续复读/刷屏时，角色逐渐厌烦直至暂时不理。
# 判重与连击计数在接入层（如 nb2 QQ 适配器）按发送者进行——被「不理」期间的消息
# 在适配器侧直接丢弃，不进 Runtime，零 token 消耗；厌烦区与「最后一句话」都以
# 注入上下文的方式交给角色用符合性格的语气表达。
repeat_guard:
  enabled: true
  similarity: 0.75        # 与近期消息相似度 ≥ 该值判为复读（0~1）
  history_size: 5         # 每用户参与判重的近期消息条数
  warn_streak: 3          # 连续复读达到该次数：注入厌烦情绪，回复转冷淡
  mute_streak: 5          # 连续复读达到该次数：角色最后一句话表态，随后进入「不理」冷却
  mute_minutes: 10        # 「不理」冷却时长（分钟），期间复读消息直接忽略
  llm_break: true         # 冷却期内遇到「有新意」的内容时，由 LLM 以角色性格做破例判定（消气原谅/破例回一句）；false = 一律静默到冷却结束（零额外 token）

# 工具配置
tool:
  enabled: true
  builtin_tools: ["time", "moon", "system"] # 内置工具白名单；可加入 "web_search" 开启自有联网搜索工具注入
  custom_tools_path: null
  web_search:
    enabled: false           # 自有 web_search 工具总开关；默认关闭，避免隐私和成本风险
    provider: "ddg"         # ddg / bing / api / mixed；mixed 会合并 ddg 与 API 结果
    max_results: 10
    timeout: 10
    cache_ttl_seconds: 300
    trigger_strategy: "explicit" # off / explicit / auto；仅注入提示引导模型调用工具，不自动联网
    freshness_keywords: ["今天", "今日", "现在", "当前", "最新", "新闻", "价格", "版本", "发布", "更新", "today", "latest", "news", "price", "version"]
    prefer_for_characters: [] # 角色名命中时，引导其优先联网核验
    prefer_for_scenarios: []  # system_contexts 场景关键词命中时，引导联网核验
    user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36"
    region: null             # 例如 zh-CN / en-US，用于 Accept-Language
    safe_search: "moderate"  # 预留：off / moderate / strict
    snippet_max_length: 200
    api:
      endpoint: null         # 通用搜索 API endpoint，例如 https://api.tavily.com/search
      method: "POST"         # GET / POST
      api_key: null
      api_key_header: "Authorization"
      api_key_prefix: "Bearer "
      headers: {}
      request_template:
        query: "{query}"
        count: "{max_results}"
      query_params: {}
      results_path: "results"
      title_path: "title"
      url_path: "url"
      snippet_path: "content"
      published_at_path: null

# Runtime 资源控制配置
resource_control:
  enabled: true
  runtime_max_concurrent: 4          # Runtime 入口总并发，覆盖高成本 RPC / stream
  runtime_queue_size: 8              # 资源占满时最多允许等待的请求数；超过后直接返回资源限制错误
  session_max_concurrent: 1          # 单 Runtime 当前会话消息并发；默认保持单会话串行
  provider_max_concurrent: 2         # 预留 Provider 并发上限，阶段五先用于配置与诊断
  stream_max_concurrent: 1           # 流式消息并发上限
  model_max_concurrent: 2            # 模型类动作并发上限
  tool_max_concurrent: 2             # 工具类动作并发上限
  web_search_max_concurrent: 1       # 联网搜索类动作并发上限
  image_generation_max_concurrent: 1 # 图片生成类动作并发上限，当前预留
  dependency_install_max_concurrent: 1 # 依赖安装类动作并发上限
  acquire_timeout_seconds: 0.25      # 排队获取资源的最长等待秒数；reject 策略下建议保持较小
  default_timeout_seconds: 120.0     # Runtime 高成本动作默认总超时预留
  dependency_install_timeout_seconds: 600 # dependency.install 默认安装超时
  overflow_policy: "reject"          # reject / wait；reject 会快速返回结构化资源限制错误
  tenant_max_agents_per_user: 32     # 每用户内存中同时装配的租户 Agent 上限；满时休眠最久未活跃租户（数据保留，再发言自动唤醒），全忙才报错

# 会话配置
# 场景系统：把"角色所处环境"外置为常驻结构化状态，降低角色扮演的上下文负担。
# 启用后，需在 tool.builtin_tools 里加入 "scene"，模型才能获得 scene_switch / get_current_scene 工具。
# 场景库全局共享，从 library_path 目录加载 *.yaml；当前场景随会话持久化。
# 场景描述仅在"对话开始"时注入一次（新会话首轮 / 恢复会话后首轮），
# 之后不再每轮注入，模型遗忘时可主动调用 get_current_scene 查看。
scene:
  enabled: false # 默认关闭；改为 true 开启场景系统
  library_path: ./scenes # 场景库目录（递归加载 *.yaml）
  default_scene: null # 会话未记录场景时的默认起始场景 id，如 hakurei_shrine
  enforce_connectivity: false # true 时切换必须走目标场景的 connected_scenes

session:
  auto_save: true
  save_path: ./sessions
  max_sessions: 100

# 多角色 World 编排（GensokyoWorld）：单模型演一整台戏，由导演决定每轮谁发言。
# 默认关闭；单角色模式完全不受影响。启用需 enabled: true 并配置 actors。
# 完整示例见 config/world_example.yaml。
world:
  enabled: false            # 总开关；false 时走单角色模式
  id: gensokyo              # World 标识，用于会话与记忆按世界隔离
  protagonist: __user__     # "__user__"=用户先说；或某个 actor id=该角色主动开场
  user_initial_scene: null  # 用户起始场景 id；null 时随 protagonist 或 scene.default_scene
  actors: []                # 角色花名册，见 world_example.yaml
  director:
    enabled: true
    temperature: 0.2
    max_tokens: 384
    max_auto_turns: 4       # 一段自动表演最多连续轮数，到顶强制交还用户，防烧 token
    max_same_actor_turns: 2 # 同一角色最多连续发言轮数
    fallback_action: wait_user  # 决策非法/解析失败时的兜底：wait_user / continue
  transcript:
    context_entries: 24     # 每轮注入模型的最近共享剧本条数
    max_entries_per_scene: 500
  persistence:
    enabled: true
    save_path: ./sessions/world  # world 命名空间根：存档/角色会话/语义记忆同树管理
  project_perspective_memories: true  # 表演段落结束后为在场角色各写各视角记忆
  user_follows_current_actor: true    # 当前演员切场景时用户是否跟随
